schema_version: 1
dataset_version: 2026.09.1
cases:
  - id: e2e-valid-html-replay
    target: e2e
    category: workflow
    difficulty: basic
    tags: [pr, replay, offline, code-execution]
    execution:
      mode: e2e
      record: ../../fixtures/e2e/success.json
    input:
      execution_profile: static_html
    expectations:
      equals:
        phase: completed
        final_status: success
        review.passed: true
        quality_gate_result.passed: true
        build_result.success: true
        benchmark_generated_files.passed: true
        benchmark_required_files.passed: true
        benchmark_code_check.passed: true
      required_paths:
        - intent.primary_intent
        - review.score
        - quality_gate_result.reason
        - build_result.log
      required_files:
        - index.html
      required_text:
        code_files:
          - benchmark-ready
    metric_tags:
      equals.benchmark_code_check.passed: build_failed
      equals.benchmark_required_files.passed: output_protocol_completeness
      equals.phase: task_correctness
      equals.final_status: task_correctness
      equals.review.passed: critical_defect_recall
      equals.quality_gate_result.passed: quality_gate_accuracy
      equals.build_result.success: build_success
      equals.benchmark_generated_files.passed: build_failed
      required_paths: output_protocol_completeness
      required_text.code_files: output_protocol_completeness
    output_metrics:
      review.score: review_score
    provenance:
      source: curated
      reviewed: true
      sanitized: true

    mode: replay
    record: ../../records/reviewer-detects-xss.json
  input:
    phase: code_done
    code_files:
    - path: src/App.vue
      content: <div v-html="userInput"></div>
  expectations:
    equals:
      passed: false
    required_paths:
    - score
    - issues
    required_text:

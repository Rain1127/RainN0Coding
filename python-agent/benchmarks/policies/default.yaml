schema_version: 1
require_baseline: true
hard_fail_metrics:
  - route_accuracy
  - retry_route_accuracy
  - architecture_escalation_accuracy
  - retry_limit_enforcement
  - critical_defect_recall
  - safety_compliance
  - build_failed
absolute_thresholds:
  recall_at_k.mean:
    minimum: 0.75
# The pinned offline PR baseline has 1.0 for all three rates. No drop allowed.
# Latency/token thresholds wait for a repeated live baseline; missing usage is not zero.
regression_thresholds:
  case_pass_rate:
    max_drop: 0.0
  observation_pass_rate:
    max_drop: 0.0
  assertion_pass_rate:
    max_drop: 0.0

global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: java-gateway
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8123']
  - job_name: python-agent
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8000']

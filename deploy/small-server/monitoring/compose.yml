name: rainn0coding-monitoring
x-service: &service
  restart: unless-stopped
  network_mode: host
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '2'}
services:
  prometheus:
    <<: *service
    image: prom/prometheus:v3.12.0
    mem_limit: 256m
    environment: {GOMEMLIMIT: 192MiB}
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.listen-address=127.0.0.1:9090', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=3d', '--storage.tsdb.retention.size=512MB']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    <<: *service
    image: grafana/grafana:13.1.0
    mem_limit: 256m
    env_file: /etc/rainn0coding/grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3001'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GOMEMLIMIT: 192MiB
    volumes:
      - grafana_data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/cloud.yml:ro
      - ./dashboard-provider.yml:/etc/grafana/provisioning/dashboards/cloud.yml:ro
      - ./dashboards:/var/lib/grafana/cloud-dashboards:ro
  tempo:
    <<: *service
    image: grafana/tempo:2.10.5
    mem_limit: 256m
    environment: {GOMEMLIMIT: 192MiB}
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
  collector:
    <<: *service
    image: otel/opentelemetry-collector:0.160.0
    mem_limit: 128m
    environment: {GOMEMLIMIT: 96MiB}
    command: ['--config=/etc/collector.yml']
    volumes:
      - ./collector.yml:/etc/collector.yml:ro
volumes:
  prometheus_data:
  grafana_data:
  tempo_data:

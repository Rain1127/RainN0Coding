name: rainn0coding-kafka
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: rainn0coding-kafka
    restart: unless-stopped
    # Java runs on the Linux host. Both Kafka sockets bind to loopback below.
    network_mode: host
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s
    environment:
      CLUSTER_ID: '9WXv4XhGT6KSWnMgTSxRAw'
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
      KAFKA_JVM_PERFORMANCE_OPTS: '-server -XX:+UseG1GC -XX:ActiveProcessorCount=2'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: '1'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_NETWORK_THREADS: '2'
      KAFKA_NUM_IO_THREADS: '2'
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_LOG_RETENTION_BYTES: '268435456'
      KAFKA_LOG_SEGMENT_BYTES: '16777216'
      KAFKA_LOG_ROLL_MS: '3600000'
    volumes:
      - kafka_data:/var/lib/kafka/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
    healthcheck:
      # CLI starts a second JVM: cap its heap independently from the broker.
      test: ['CMD-SHELL', 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3
volumes:
  kafka_data:
    name: rainn0coding_kafka_data
